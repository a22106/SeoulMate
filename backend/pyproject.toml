[project]
name = "backend"
version = "0.1.0"
description = "SeoulMate Backend API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.134.0",
    "google-cloud-secret-manager>=2.26.0",
    "google-genai>=1.65.0",
    "psycopg-pool>=3.3.0",
    "psycopg[binary]>=3.3.3",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "uvicorn[standard]>=0.41.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
