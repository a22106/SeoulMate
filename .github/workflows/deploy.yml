name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.prod.yml"

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Write backend .env.prod from secrets
        run: printf 'GEMINI_API_KEY=%s\nDATABASE_URL=%s\nGCLOUD_PROJECT=%s\n' "$GEMINI_API_KEY" "$DATABASE_URL" "$GCLOUD_PROJECT" > backend/.env.prod
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GCLOUD_PROJECT: ${{ secrets.GCLOUD_PROJECT }}

      - name: Deploy with Docker Compose
        run: docker compose -f docker-compose.prod.yml up -d --build

      - name: Wait for healthy
        run: |
          for i in $(seq 1 24); do
            if curl -sf http://localhost:30002/health; then
              echo ""
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for backend... ($i/12)"
            sleep 5
          done
          echo "Health check failed after 120s"
          docker compose -f docker-compose.prod.yml logs backend
          exit 1

      - name: Prune old images
        run: docker image prune -f
