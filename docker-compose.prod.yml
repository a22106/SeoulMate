services:
  backend:
    build: ./backend
    container_name: seoulmate-backend
    restart: unless-stopped
    ports:
      - "30002:8000"
    env_file:
      - ./backend/.env.prod
    networks:
      - postgres_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  postgres_default:
    external: true
