services:
  backend:
    build: ./backend
    container_name: seoulmate-backend
    restart: unless-stopped
    ports:
      - "30002:8000"
    env_file:
      - ./backend/.env.prod
    volumes:
      - /home/bk22106/.config/gcloud/application_default_credentials.json:/app/gcloud/application_default_credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcloud/application_default_credentials.json
    networks:
      - postgres_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  postgres_default:
    external: true
